name: zuco-llm-align
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.26
  - scipy>=1.12
  - pandas>=2.2
  - matplotlib>=3.8
  - openpyxl>=3.1
  - scikit-learn>=1.4
  - pip:
      - -r requirements.txt

# PyTorch is installed per-platform — see README "Setup" section.
# Reason: CUDA build differs between sulab (Win10 + CUDA) and Mac (MPS/CPU);
# pinning here breaks cross-machine portability.
